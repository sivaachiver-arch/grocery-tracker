<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Personal Grocery & Shopping Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🛒 Personal Grocery & Shopping Tracker</h1>
    <div class="dashboard">

    <div class="summary-card">
        <h3>Total Items</h3>
        <p id="totalItems">0</p>
    </div>

    <div class="summary-card">
        <h3>Total Quantity</h3>
        <p id="totalQuantity">0</p>
    </div>

    <div class="summary-card">
        <h3>Total Amount</h3>
        <p>₹<span id="dashboardTotal">0</span></p>
    </div>

</div>
    <h2>Add Item</h2>

<label>Category:</label>

<select id="category">
    <option value="">Select Category</option>
    <option value="Grocery">Grocery</option>
    <option value="Vegetables">Vegetables</option>
    <option value="Fruits">Fruits</option>
    <option value="Snacks">Snacks</option>
</select>

<label>Item Name:</label>
<input type="text" id="itemName" placeholder="Enter item name">

<label>Quantity:</label>
<input type="number" id="quantity" placeholder="Enter quantity">

<label>Price:</label>
<input type="number" id="price" placeholder="Enter price">

<button id="addItem">Add Item</button>

<h2>Shopping List</h2>
<input type="text" id="searchInput" placeholder="Search item">
<label>Filter by Category:</label>

<select id="categoryFilter">
    <option value="all">All Categories</option>
    <option value="Grocery">Grocery</option>
    <option value="Vegetables">Vegetables</option>
    <option value="Fruits">Fruits</option>
    <option value="Snacks">Snacks</option>
</select>
<h2>Total Amount: ₹<span id="totalAmount">0</span></h2>

<div id="shoppingList"></div>
<button id="clearAll">Clear All Items</button>

<script src="script.js"></script>
</body>
</html>
